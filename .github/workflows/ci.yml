name: CI - Build and Test

on:
  push:
    branches:
      - main
      - development

  pull_request:
    branches:
      - main
      - development

jobs:

  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Backend Dependencies
        run: |
          cd backend
          npm install

      - name: Install Frontend Dependencies
        run: |
          cd frontend
          npm install

      - name: Build React Frontend
        run: |
          cd frontend
          npm run build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker Images
        run: |
          docker compose build


  api-test:
    name: API Testing
    needs: build
    runs-on: ubuntu-latest

    steps:

      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Create backend .env
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: |
          if [ -z "$JWT_SECRET" ]; then
            echo "::error::JWT_SECRET GitHub secret is missing or empty"
            exit 1
          fi

          printf 'JWT_SECRET=%s\n' "$JWT_SECRET" > backend/.env
          printf 'JWT_EXPIRES_IN=1d\n' >> backend/.env

          echo "backend/.env created successfully"

      - name: Build Docker Images
        run: |
          docker compose build

      - name: Start Application
        run: |
          docker compose up -d

      - name: Check Docker Containers
        run: |
          docker compose ps

      - name: Check Backend Environment
        run: |
          docker compose exec -T backend sh -c 'test -n "$JWT_SECRET" && echo "JWT_SECRET: PRESENT" || echo "JWT_SECRET: MISSING"'
          docker compose exec -T backend sh -c 'echo "JWT_EXPIRES_IN=$JWT_EXPIRES_IN"'
          docker compose exec -T backend sh -c 'echo "MONGO_URI=$MONGO_URI"'

      - name: Check MongoDB Connection
        run: |
          docker compose exec -T backend node -e "
            const mongoose = require('mongoose');

            mongoose.connect(process.env.MONGO_URI)
              .then(() => {
                console.log('MongoDB CONNECTION: OK');
                process.exit(0);
              })
              .catch(err => {
                console.error('MongoDB CONNECTION: FAILED');
                console.error(err.message);
                process.exit(1);
              });
          "

      - name: Show Backend Logs
        run: |
          docker compose logs backend --tail=100

      - name: Install Newman
        run: |
          npm install -g newman

      - name: Run all Postman API Tests
        run: |
          collections=(postman/lab-5/*.json)

          if [ ! -e "${collections[0]}" ]; then
            echo "No Postman collections found in postman/lab-5."
            exit 0
          fi

          for collection in "${collections[@]}"; do
            echo "======================================"
            echo "Running Postman collection:"
            echo "$collection"
            echo "======================================"

            newman run "$collection" \
              --env-var "baseUrl=http://localhost:5000"
          done

      - name: Show Docker Logs
        if: failure()
        run: |
          docker compose logs

      - name: Stop Application
        if: always()
        run: |
          docker compose down