name: CD - Deploy to Azure

on:
  push:
    branches:
      - main
      - production

jobs:
  deploy:
    name: Deploy to Azure VM
    runs-on: self-hosted

    steps:
      # ----------------------------------------
      # Go to project directory
      # ----------------------------------------
      - name: Go to project directory
        run: |
          cd ~/WEB-II
          pwd

      # ----------------------------------------
      # Pull latest code
      # ----------------------------------------
      - name: Pull latest code
        run: |
          cd ~/WEB-II
          git fetch origin
          git checkout ${{ github.ref_name }}
          git pull origin ${{ github.ref_name }}

      # ----------------------------------------
      # Stop old containers
      # ----------------------------------------
      - name: Stop old containers
        run: |
          cd ~/WEB-II
          docker compose down

      # ----------------------------------------
      # Build new containers
      # ----------------------------------------
      - name: Build new containers
        run: |
          cd ~/WEB-II
          docker compose build

      # ----------------------------------------
      # Start containers
      # ----------------------------------------
      - name: Start containers
        run: |
          cd ~/WEB-II
          docker compose up -d

      # ----------------------------------------
      # Check container status
      # ----------------------------------------
      - name: Check container status
        run: |
          cd ~/WEB-II
          docker compose ps

      # ----------------------------------------
      # Test backend (With Wait / Retry Loop)
      # ----------------------------------------
      - name: Test backend
        run: |
          echo "Waiting for backend to start listening on port 5000..."
          for i in {1..10}; do
            if curl -f http://localhost:5000 > /dev/null 2>&1; then
              echo "✅ Backend is live and responding!"
              exit 0
            fi
            echo "Attempt $i/10: Backend not ready yet, retrying in 2 seconds..."
            sleep 2
          done

          echo "❌ Backend failed to respond on port 5000 within 20 seconds."
          cd ~/WEB-II && docker compose logs --tail=50
          exit 1

      # ----------------------------------------
      # Remove unused images
      # ----------------------------------------
      - name: Remove unused images
        run: |
          docker image prune -f

      # ----------------------------------------
      # Deployment completed
      # ----------------------------------------
      - name: Deployment completed
        run: |
          echo "======================================"
          echo "Deployment Successful"
          echo "Branch: ${{ github.ref_name }}"
          echo "======================================"