services:

  mongodb:
    image: mongo:8
    container_name: webii-mongodb
    restart: unless-stopped

    volumes:
      - mongodb_data:/data/db

    networks:
      - web-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: webii-backend
    restart: unless-stopped

    expose:
      - "5000"

    depends_on:
      - mongodb

    env_file:
      - ./backend/.env

    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/university_bus_booking

    networks:
      - web-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: webii-frontend
    restart: unless-stopped

    expose:
      - "3000"

    depends_on:
      - backend

    environment:
      - HOST=0.0.0.0
      - DANGEROUSLY_DISABLE_HOST_CHECK=true

    networks:
      - web-network


  nginx:
    image: nginx:alpine
    container_name: webii-nginx
    restart: unless-stopped

    ports:
      - "80:80"
      - "443:443"

    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - /home/azureuser/busbooking_ssl_cert/ssl:/etc/nginx/ssl:ro

    depends_on:
      - frontend
      - backend

    networks:
      - web-network


volumes:
  mongodb_data:


networks:
  web-network:
    driver: bridge