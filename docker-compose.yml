services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: webii-backend

    restart: unless-stopped

    ports:
      - "5000:5000"

    networks:
      - web-network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: webii-frontend

    restart: unless-stopped

    ports:
      - "80:3000"

    depends_on:
      - backend

    environment:
      - HOST=0.0.0.0

    networks:
      - web-network

networks:
  web-network:
    driver: bridge