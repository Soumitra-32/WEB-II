services:

  mongodb:
    image: mongo:8
    container_name: webii-mongodb
    restart: unless-stopped

    ports:
      - "27017:27017"

    volumes:
      - mongodb_data:/data/db

    networks:
      - web-network


  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile

    container_name: webii-backend
    restart: unless-stopped

    ports:
      - "5000:5000"

    depends_on:
      - mongodb

    environment:
      - PORT=5000
      - MONGO_URI=mongodb://mongodb:27017/university_bus_booking

    networks:
      - web-network


  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile

    container_name: webii-frontend
    restart: unless-stopped

    ports:
      - "80:3000"

    depends_on:
      - backend

    environment:
      - HOST=0.0.0.0

    networks:
      - web-network


volumes:
  mongodb_data:


networks:
  web-network:
    driver: bridge
